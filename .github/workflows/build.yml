name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    strategy:
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            name: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            name: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend deps
        working-directory: app
        run: npm ci --no-fund --no-audit
      - name: Unit tests
        run: cargo test --workspace
      - name: Build app bundle
        working-directory: app
        run: npx tauri build --bundles app --target ${{ matrix.target }}
      - name: Build CLI
        run: cargo build --release -p godsend-psp-cli --target ${{ matrix.target }}
      - name: Make DMG
        run: |
          APP=$(find target/${{ matrix.target }}/release/bundle/macos -name "*.app" | head -1)
          hdiutil create -volname "GODsend PSP" -srcfolder "$APP" -ov -format UDZO \
            "godsend-psp-macos-${{ matrix.name }}.dmg"
          tar -czf "godsend-psp-cli-macos-${{ matrix.name }}.tar.gz" \
            -C target/${{ matrix.target }}/release godsend-psp
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.name }}
          path: |
            *.dmg
            *.tar.gz

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf ffmpeg
      - name: Install frontend deps
        working-directory: app
        run: npm ci --no-fund --no-audit
      - name: Unit tests
        run: cargo test --workspace
      - name: Build bundles
        working-directory: app
        run: npx tauri build --bundles deb,appimage
      - name: Build CLI
        run: |
          cargo build --release -p godsend-psp-cli
          tar -czf godsend-psp-cli-linux-x64.tar.gz -C target/release godsend-psp
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            godsend-psp-cli-linux-x64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend deps
        working-directory: app
        run: npm ci --no-fund --no-audit
      - name: Unit tests
        run: cargo test --workspace
      - name: Build installer
        working-directory: app
        shell: bash
        run: npx tauri build --bundles nsis
      - name: Build CLI zip
        shell: pwsh
        run: |
          cargo build --release -p godsend-psp-cli
          Compress-Archive -Path target/release/godsend-psp.exe -DestinationPath godsend-psp-cli-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            target/release/bundle/nsis/*-setup.exe
            godsend-psp-cli-windows-x64.zip

  ui-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend deps
        working-directory: app
        run: npm ci --no-fund --no-audit
      - name: Playwright
        working-directory: app
        run: |
          npx playwright install chromium --with-deps
          npx playwright test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows, ui-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          mkdir release
          find artifacts -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" \
            -o -name "*.deb" -o -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} release/ \;
          cd release
          # normalize names to godsend-psp-<version>-<platform>.<ext>
          for f in *.dmg; do [ -e "$f" ] || continue
            case "$f" in
              *aarch64*|*arm64*) mv "$f" "godsend-psp-${VERSION}-arm64.dmg";;
              *x86_64*|*x64*) mv "$f" "godsend-psp-${VERSION}-x64.dmg";;
            esac
          done
          for f in *setup.exe; do [ -e "$f" ] || continue
            mv "$f" "godsend-psp-${VERSION}-x64-setup.exe"
          done
          for f in *.AppImage; do [ -e "$f" ] || continue
            mv "$f" "godsend-psp-${VERSION}-linux-x64.AppImage"
          done
          for f in *.deb; do [ -e "$f" ] || continue
            mv "$f" "godsend-psp-${VERSION}-linux-x64.deb"
          done
          for f in *macos*arm64*; do [ -e "$f" ] || continue
            case "$f" in *arm64*) mv "$f" "godsend-psp-cli-${VERSION}-macos-arm64.tar.gz";; esac
          done 2>/dev/null || true
          for f in *macos*x64*; do [ -e "$f" ] || continue
            mv "$f" "godsend-psp-cli-${VERSION}-macos-x64.tar.gz"
          done 2>/dev/null || true
          for f in *linux-x64.tar.gz; do [ -e "$f" ] || continue
            mv "$f" "godsend-psp-cli-${VERSION}-linux-x64.tar.gz"
          done
          for f in *windows-x64.zip; do [ -e "$f" ] || continue
            mv "$f" "godsend-psp-cli-${VERSION}-windows-x64.zip"
          done
          ls -la
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* \
            --repo "${{ github.repository }}" \
            --title "GODsend PSP ${{ github.ref_name }}" \
            --notes "All-platform builds of GODsend PSP. See the README for install notes and docs/guides for walkthroughs."
